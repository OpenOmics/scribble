[package]
name = "getzen"
version = "0.0.1"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
indicatif = "0.17"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
sha2 = "0.10"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true